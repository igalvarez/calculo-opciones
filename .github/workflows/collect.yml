# Guardar en el repo como:  .github/workflows/collect.yml
name: collect

on:
  schedule:
    # Hora UTC. Cubre la sesion de Nueva York en verano e invierno; un primer paso comprueba
    # la hora real de NY y, fuera de 9:45-16:00, el resto del flujo se salta (casi no gasta minutos).
    # Cada 15 min en las primeras horas (cuando operas) y cada 30 min despues.
    # Se evitan los minutos :00 y :30 porque GitHub se satura y retrasa o descarta ejecuciones.
    - cron: "7,22,37,52 13-16 * * 1-5"
    - cron: "7,37 17-20 * * 1-5"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Modo prueba: ignora el horario, NO guarda en el repo ni publica; solo muestra el resultado en el log"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.pub.outputs.publish }}
    steps:
      - name: Comprobar horario de mercado (hora de Nueva York)
        id: mh
        env:
          EVENT: ${{ github.event_name }}
        run: |
          dow=$(TZ=America/New_York date +%u)
          hm=$((10#$(TZ=America/New_York date +%H%M)))
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"; echo "Ejecucion manual"
          elif [ "$dow" -le 5 ] && [ "$hm" -ge 945 ] && [ "$hm" -lt 1600 ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"; echo "Mercado abierto (NY $hm)"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"; echo "Fuera de horario (NY dia $dow, $hm): no se hace nada"
          fi

      - uses: actions/checkout@v4
        if: steps.mh.outputs.open == 'true'

      - uses: actions/setup-python@v5
        if: steps.mh.outputs.open == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: steps.mh.outputs.open == 'true'
        run: pip install -r requirements.txt

      - name: Foto (modo prueba, no se guarda)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba }}
        run: |
          python opciones_baseline.py collect --tickers tickers.txt --csv prueba.csv --force
          echo "--- primeras filas guardadas ---"
          head -5 prueba.csv || true

      - name: Foto real
        if: ${{ steps.mh.outputs.open == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.prueba) }}
        run: |
          mkdir -p data
          python opciones_baseline.py collect --tickers tickers.txt --csv data/options_snapshots.csv

      - name: Generar pagina HTML
        if: ${{ steps.mh.outputs.open == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.prueba) }}
        run: python opciones_baseline.py html --tickers tickers.txt --csv data/options_snapshots.csv --out docs/index.html

      - name: Guardar en el repo
        if: ${{ steps.mh.outputs.open == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.prueba) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/options_snapshots.csv || true
          git add docs/index.html || true
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "foto $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      - name: Preparar pagina para GitHub Pages
        if: ${{ steps.mh.outputs.open == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.prueba) }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Marcar publicar
        id: pub
        if: ${{ steps.mh.outputs.open == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.prueba) }}
        run: echo "publish=true" >> "$GITHUB_OUTPUT"

  # Publica la pagina. Si GitHub Pages no esta activado (o el repo es privado en plan gratuito),
  # este trabajo falla pero NO afecta a la recogida de datos (continue-on-error).
  deploy:
    needs: collect
    if: needs.collect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
